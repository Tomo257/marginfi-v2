[workspace]
resolver = "2"
members = [
    "programs/marginfi",
    "test-utils",
    "programs/mocks",
    "programs/test_transfer_hook",
    "clients/rust/marginfi-cli"
]
# exclude = [
#   "programs/liquidity-incentive-program",
#   "programs/brick",
# ]

[workspace.dependencies]
# Agave/Solana 3.0.x migration
solana-cli-output = "3.0.10"
solana-client = "3.0.10"
solana-sdk = "3.0.0"
solana-logger = "3.0.10"
solana-program = "3.0.0"
solana-program-test = "3.0.10"
solana-account-decoder = "3.0.10"
solana-transaction-status = "3.0.10"
# New extracted modules in Solana 3.0
solana-system-program = "3.0.10"
solana-instruction = "3.1.0"
solana-message = "3.0.1"
solana-system-interface = { version = "3.0.0", features = ["bincode"] }
solana-compute-budget-interface = "3.0.0"
# SPL tokens for Solana 3.0
spl-token = "9.0.0"
spl-associated-token-account = "8.0.0"
spl-token-2022 = { version = "10.0.0", features = ["no-entrypoint"] }
spl-transfer-hook-interface = "0.9.0"
spl-tlv-account-resolution = "0.9.0"

anchor-lang = { version = "0.31.1" }
anchor-spl = { version = "0.31.1", features = ["token_2022"] }
anchor-client = { version = "0.31.1" }

fixtures = { path = "test-utils", package = "test-utilities" }
marginfi = { path = "programs/marginfi", package = "marginfi" }
transfer_hook = { path = "programs/test_transfer_hook", package = "test_transfer_hook" }

pyth-solana-receiver-sdk = { git = "https://github.com/Tomo257/pyth-crosschain", package = "pyth-solana-receiver-sdk", branch = "main" }
# pyth-solana-receiver-sdk = "0.6.1"
# pythnet-sdk = "2.3.1"
switchboard-on-demand = "0.10.5"
solana-stake-program = "3.0.10"

borsh = "1.5.7"
bytemuck = "1.23.1"
bs58 = "0.5.1"
# Note: 1.29.0 and later require Rust 1.83+ which solana does not ship with (yet)
fixed = "=1.28.0"
fixed-macro = "1.2.0"
lazy_static = "1.4.0"
type-layout = "0.2.0"
static_assertions = "1.1.0"

[profile.release]
overflow-checks = false
lto = "off"
codegen-units = 8


## Build options for release (build-program-verifiable should use these through env settings)
